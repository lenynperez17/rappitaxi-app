pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Ronda 284: 8.7.3 → 8.11.1, el mínimo que exige Flutter 3.47. Va de la
    // mano con el wrapper de Gradle 8.14.3: AGP 8.11 pide Gradle 8.13 o
    // superior. Con Java 21 y compileSdk 36 no hace falta nada más.
    id "com.android.application" version "8.11.1" apply false
    // Ronda 284: 2.1.20 → 2.2.20, el mínimo de Flutter 3.47. Tercera pieza de
    // la misma cadena: Gradle 8.14.3 + AGP 8.11.1 + Kotlin 2.2.20.
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.google.gms.google-services" version "4.4.3" apply false
}

include ":app"